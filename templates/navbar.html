<!DOCTYPE html>
<html>
    <head>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:500');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        .navbar{
            position: sticky;
            top: 0;
        }

        main {
            margin: 0 20px;
        }

        /* Logo */
            .logo {
            width: 100px;
            height: auto;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* Navbar container */
        .navbar ul {
            display: flex;
            align-items: stretch;
            background-color: rgb(50,61,127);
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* Navbar items */
        .navbar li {
            flex: 1;
            display: flex;
        }
        /* Navbar links */
        .navbar a {
            color: white;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-decoration: none;
            text-align: center;
        }

        .navbar li{
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
        }

        .login{
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(50,61,127);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            height: 100%;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
        }

        .login:hover {
            background-color: rgb(63,78,158);
        }

        /* Hover state */
        .navbar a:hover {
            background-color: rgb(63,78,158);
        }
        a li {
            transition: all 0.3s ease 0s;
        }
        .navbar ul > a:first-child:hover {
            background-color: transparent;
        }
        .navbar ul > a:first-child:hover .logo{
            transform: scale(1.15);
        }

        .user_info {
            display: flex;
            flex-direction: column;
        }
        </style>
    </head>
    
    <body>
        <form action = "/login" method="post">
            <nav class = "navbar">
                <ul>
                    <a href="/"><li><img class="logo" src="/image/3rd_logo.jpeg"></li></a>
                    <a href="/about"><li>O nás</li></a>
                    <a href="/foods"><li>Seznam jídel</li></a>
                    <a href="/add_food"><li>Přidat jídlo</li></a>
                    <a href="/contacts"><li>Kontakty</li></a>
                    {% if not username %}
                        <a href="/login"><li>Přihlášení</li></a>
                    {% else %}
                        <a href="/"><li>Odhlásit se</li></a>
                        <div class = "user_info">
                            <li>Uživatel: {{ username }}</li>
                            <li>Kredit: {{ kredit }}</li>
                        </div>
                    {% endif %}
                </ul>
            </nav>
        </form>
    </body>
</html>
