<!DOCTYPE html>
<html>
<head>
  <title>Hodnocení jídelny</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    .not_navbar{
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .datalist {
        border: 1px solid black;
        margin-left: 20%;
        margin-right: 20%;
        top: 0;
    }
  </style>
</head>
<body>
    {% include "navbar.html" %}
    <form action="{{ url_for('add_food') }}" method="post" enctype="multipart/form-data"></form>
        <div class="not_navbar">
            <label for="food_name">Název jídla:</label>
            <input type="text" id="food_name" name="food_name" placeholder="Název jídla" list="foodList">
            <datalist class="datalist" id="foodList">
                {% for food,images in foods %}
                    <option value="{{food}}">
                {% endfor %}
            </datalist>
            
            <label for="rating">Hodnocení:</label>
            <input type="number" id="rating" name="rating" placeholder="Hodnocení (1-7)" min="1" max="7">
            
            <input type="file" name="file">

            <p><button type="submit">Submit</button></p>
        
        </div>
    </form>
</body>
