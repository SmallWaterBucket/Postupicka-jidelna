<!DOCTYPE html>
<html>
<head>
  <title>Všechny jídla</title></title>
  <link rel="icon" href="/favicon.ico">
  <style>
        @font-face {
            font-family: 'Aurach';
            src: url("/static/fonts/AurachHeavy.ttf") format('truetype');
        }
        h1{
            font-family: 'Aurach';
            color: rgb(50,61,127);
        }
        .foods{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }
        .food_container{
            width: 250px;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .image {
            max-width: 200px;
            max-height: 200px;
            width: auto;
            height: auto;
            object-fit: contain;
        }
  </style>
</head>
<body>
    <div class="navbar">
        {% include "navbar.html" %}
    </div>
    <h1><u>Všechna jídla, která byla nahrána na tuto stránku: ({{foods|length}})</u></h1>
    <div class="foods">
        {% for food, food_id,image,rating in foods %}
            <div class="food_container">
                <a href="/get_food/{{food_id}}">
                    <p>{{food}}</p>
                </a>
                <a href = "{{image}}">
                    <img class="image" src="{{image}}" alt="{{food}}">
                </a>
                <p>Rating: {{rating}}</p>
            </div>
        {% endfor %}
    </div>
    <p>Není tady to co hledáte? <a href="/add_food">Přidejte ho</a></p>
</body>
</html>
