<!DOCTYPE html>
<html>
<head>
  <title>Výběr jídelny</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/styles/navbar.css?v=12">
  <link rel="icon" href="/favicon.ico">
</head>
<style>
    .not_navbar {

        color: rgb(50,61,127);

        display:flex;
        flex-grow:1;
        align-items: center;
        flex-direction: column;
    }
</style>
<body>
    {% include "navbar.html" %}
    <div class = "not_navbar">
        <h1><u>Výběr jídelny</u></h1>
        <p>Vitejte na nasi strance. Prosim vyberte si nazev vasi jidelny, nebo ji <a href="/add_canteen">stvorte</a></p>
        <form action="/canteens" method="post">
            <label for="canteen_id">Jidelna:</label>
            <select id="canteen_id" name="canteen_id">
                {% for canteen,id in canteens %}
                    <option value="{{id}}">{{canteen}}</option>
                {% endfor %}
            </select>
            <button type="submit">Pokračovat</button>
        </form>
    </div>
</body>
</html>
